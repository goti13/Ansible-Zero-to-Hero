---
- hosts: linux
  become: yes

  tasks:
    - name: Install EPEL (Rocky only)
      yum:
        name: epel-release
        update_cache: yes
        state: latest
      when: ansible_distribution == "Rocky"

    - name: Install nginx
      package:
        name: nginx
        state: latest

    - name: Create nginx root directory
      file:
        path: "{{ nginx_root_location }}"
        state: directory
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: '0755'

    - name: Deploy website files
      copy:
        src: website/
        dest: "{{ nginx_root_location }}/"
        owner: "{{ nginx_user }}"
        group: "{{ nginx_group }}"
        mode: '0644'
      notify: Check HTTP Service

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: Check HTTP Service
      uri:
        url: "http://{{ ansible_default_ipv4.address }}"
        status_code: 200

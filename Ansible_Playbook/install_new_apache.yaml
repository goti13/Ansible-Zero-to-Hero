---
- name: Install and configure Apache
  hosts: web
  become: true
  gather_facts: yes

  tasks:

    - name: Install Apache on Debian/Ubuntu
      apt:
        name: apache2
        state: absent
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Apache on RHEL/CentOS/Rocky
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start & enable Apache on Debian/Ubuntu
      service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Start & enable Apache on RHEL/CentOS/Rocky
      service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Deploy index.html
      copy:
        content: "<h1>Hello From Ansible-managed Apache server!</h1>"
        dest: "/var/www/html/index.html"
